# Keep the SHA-pinned workflow actions current. The pins carry version comments,
# which Dependabot rewrites together with the SHA.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
