# Supply-chain and licence gate. Git dependencies require pinned revisions.

[graph]
all-features = true
# Rust on Linux is the only supported platform; other targets are not checked.
targets = ["x86_64-unknown-linux-gnu"]

[licenses]
# The list is deliberately short: an addition should require someone to look at
# the new crate and decide, rather than pass silently.
allow = ["MIT", "Apache-2.0", "MulanPSL-2.0"]
confidence-threshold = 0.93

# A disjunct that never gets selected is not a problem: an `A OR B` dependency
# matches whichever entry comes first, and MulanPSL-2.0 is offered by this
# repository rather than required of anything in the graph.
unused-allowed-license = "allow"

# `unicode-ident` ships Unicode's own data tables, and that data is licensed
# under the Unicode terms (`Unicode-3.0`) in addition to MIT or Apache-2.0.
# The terms permit use and redistribution of the data as compiled in; each
# exception is scoped to its audited crate rather than admitted globally.
# It is pinned to the audited version, so a new release is re-reviewed.
[[licenses.exceptions]]
crate = "unicode-ident@=1.0.27"
allow = ["Unicode-3.0"]

# `libfuzzer-sys` bundles LLVM's libFuzzer, which is under the NCSA licence in
# addition to MIT or Apache-2.0. The harness is not shipped and no other crate
# in its graph needs the terms, so the exception is scoped to this crate.
[[licenses.exceptions]]
crate = "libfuzzer-sys@=0.4.13"
allow = ["NCSA"]

# purrdf-lex retains Unicode tables, BSD-licensed native parsing material and the
# GB 18030 mapping data under its original ICU and Unicode Inc. agreements.
# Its package notices govern the additional terms at the pinned source.
[[licenses.exceptions]]
crate = "purrdf-lex@=4"
allow = ["Unicode-3.0", "BSD-3-Clause", "Unicode-DFS-2016", "ICU"]

# purrdf-iri ships Unicode IDNA tables with the same redistribution terms.
# The exception covers only this audited release, not arbitrary dependencies.
[[licenses.exceptions]]
crate = "purrdf-iri@=4"
allow = ["Unicode-3.0"]

# The native RDF kernel includes Unicode data under its original terms.
[[licenses.exceptions]]
crate = "purrdf-core@=4"
allow = ["Unicode-3.0"]

# The terminal bidi predicate comes from this native Unicode text package.
# Its bundled Unicode tables retain the audited package's original notices.
[[licenses.exceptions]]
crate = "purrdf-text@=4"
allow = ["Unicode-3.0"]

# The native hash package retains EFF word data under Attribution 4.0.
# Its bundled EFF notice and license remain controlling for that data.
[[licenses.exceptions]]
crate = "purrdf-hash@=4"
allow = ["CC-BY-4.0"]

# The native ECMA matcher retains Unicode 17 property aliases and ranges.
# The pinned package's data headers and license inventory retain Unicode's notice.
[[licenses.exceptions]]
crate = "purrdf-jsonschema@=4"
allow = ["Unicode-3.0"]

# Published test support embeds the JSON Schema specification's meta-schemas.
# Its bundled BSD notice remains controlling for that data.
[[licenses.exceptions]]
crate = "purrdf-testkit@=4"
allow = ["BSD-3-Clause"]

# Native Git retains Unicode normalization tables under their original notice.
[[licenses.exceptions]]
crate = "unicode-normalization@=0.1.26"
allow = ["Unicode-3.0"]

# Native diff and Git-cache hashers carry unmodified Zlib-licensed source.
# Retain its notice and mark any altered source; this admits only audited releases.
[[licenses.exceptions]]
crate = "foldhash@=0.1.5"
allow = ["Zlib"]

[[licenses.exceptions]]
crate = "foldhash@=0.2.0"
allow = ["Zlib"]

# Git object decoding requires the native Zlib implementation and its notice.
[[licenses.exceptions]]
crate = "zlib-rs@=0.6.8"
allow = ["Zlib"]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Path dependencies that name no version (the unpublished test-fixture crate, a
# dev-dependency that `cargo package` strips) are allowed; registry dependencies
# still may not use a wildcard.
allow-wildcard-paths = true
# gix-macros, a proc macro of the native Git dependency, uses syn 2; RAF uses syn 3.
skip = [
    { crate = "syn@=2.0.119", reason = "gix-macros 0.2.1 requires syn 2; RAF source parsing uses syn 3." },
    { crate = "hashbrown@=0.15.5", reason = "imara-diff 0.2.0 requires hashbrown ^0.15; native Git's gix-hashtable requires ^0.17.1." },
    { crate = "hashbrown@=0.16.1", reason = "gix-pack 0.77.0 requires clru's dynamic object cache; current clru 0.6.3 requires hashbrown ^0.16." },
    { crate = "foldhash@=0.1.5", reason = "imara-diff's hashbrown 0.15.5 requires foldhash ^0.1; clru's hashbrown 0.16.1 requires ^0.2." },
]

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
required-git-spec = "rev"
