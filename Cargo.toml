[package]
name = "rust-agentic-foundations"
description = "Root package hosting the dogfood tests of the Rust agentic foundations workspace."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dev-dependencies]
raf-workplan.workspace = true
proc-macro2.workspace = true
purrdf-lex.workspace = true
purrdf-core.workspace = true
purrdf-rdf.workspace = true
purrdf-hash.workspace = true
purrdf-testkit.workspace = true
purrdf-toml.workspace = true
raf-okf.workspace = true
raf-census.workspace = true
raf-rdf.workspace = true
raf-source.workspace = true

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["crates/cargo-raf-census", "crates/cargo-raf-workplan", "crates/raf-census", "crates/raf-docs-contract", "crates/raf-fixtures", "crates/raf-okf", "crates/raf-rdf", "crates/raf-source", "crates/raf-workplan"]
default-members = [".", "crates/raf-docs-contract"]
exclude = ["fuzz"]

[workspace.dependencies]
rust-agentic-foundations = { path = ".", version = "0.8.0" }
cap = "0.1.2"
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
raf-fixtures = { path = "crates/raf-fixtures" }
raf-census = { path = "crates/raf-census", version = "0.8.0" }
raf-okf = { path = "crates/raf-okf", version = "0.8.0" }
raf-rdf = { path = "crates/raf-rdf", version = "0.8.0" }
raf-source = { path = "crates/raf-source", version = "0.8.0" }
raf-workplan = { path = "crates/raf-workplan", version = "0.8.0" }

# Native parser resource audits depend on these exact implementations.
# Keep feature selection at each caller; pins do not freeze unified features.
syn = { version = "=3.0.8", default-features = false }
proc-macro2 = { version = "=1.0.107", default-features = false }
quote = { version = "=1.0.47", default-features = false }
unicode-ident = "=1.0.27"
rustix = { version = "1.1.5", default-features = false, features = ["fs", "std"] }
gix = { version = "=0.90.0", default-features = false, features = ["revision", "index", "sha1", "sha256"] }
imara-diff = { version = "=0.2.0", default-features = false }
capnp = { version = "=0.28.1", features = ["unaligned"] }
purrdf-markdown = { version = "=5" }
purrdf-toml = { version = "=5" }
purrdf-alloc-probe = { version = "=5" }
purrdf-ed25519 = { version = "=5" }
purrdf-hash = { version = "=5" }
purrdf-lex = { version = "=5" }
purrdf-jsonschema = { version = "=5" }
purrdf-xsd = { version = "=5" }
purrdf-rdf = { version = "=5" }
purrdf-shapes = { version = "=5" }
purrdf-core = { version = "=5" }
purrdf-iri = { version = "=5" }
purrdf-deflate = { version = "=5" }
purrdf-gts = { version = "=5" }
purrdf-text = { version = "=5" }
purrdf-testkit = { version = "=5" }

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.98.1"
authors = ["Blackcat Informatics Inc."]
license = "MIT OR Apache-2.0 OR MulanPSL-2.0"
repository = "https://github.com/Blackcat-Informatics/rust-agentic-foundations"

[workspace.lints.rust]
# In a library crate every `pub` item is a dead_code lint root, so `pub`
# silently disables dead-code detection. Declared as workspace lints rather
# than compiler flags, which would also reach path dependencies we do not own;
# workspace lints apply to workspace members only.
unused = { level = "deny", priority = -1 }
dead_code = "deny"
unreachable_pub = "deny"
unused_crate_dependencies = "warn"
missing_debug_implementations = "warn"
missing_docs = "deny"
# The Windows source reader contains one documented final-path operation.
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Cargo has no reason key for lint levels, so each exemption carries its reason
# in the comment line directly above it.
# Re-exporting through modules makes names like `foo::FooError` idiomatic.
module_name_repetitions = "allow"
# Marking every pure getter `#[must_use]` adds noise without catching real bugs.
must_use_candidate = "allow"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
used_underscore_binding = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
print_stdout = "warn"
print_stderr = "warn"
exit = "warn"
mem_forget = "warn"
unwrap_in_result = "warn"
get_unwrap = "warn"
string_slice = "warn"
map_err_ignore = "warn"
redundant_clone = "warn"
