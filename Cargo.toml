[package]
name = "rust-agentic-foundations"
description = "Root package hosting the dogfood tests of the Rust agentic foundations workspace."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
raf-workplan = { path = "crates/raf-workplan", version = "0.1.0" }

[dev-dependencies]
purrdf-lex.workspace = true
purrdf-core.workspace = true
purrdf-hash.workspace = true
purrdf-testkit.workspace = true
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
raf-okf = { path = "crates/raf-okf", version = "0.1.0" }
raf-census = { path = "crates/raf-census", version = "0.1.0" }
raf-source = { path = "crates/raf-source", version = "0.1.0" }

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["crates/cargo-census", "crates/cargo-workplan", "crates/raf-census", "crates/raf-okf", "crates/raf-rdf", "crates/raf-source", "crates/raf-workplan"]
exclude = ["fuzz"]

[workspace.dependencies]
pulldown-cmark = { version = "0.13.5", default-features = false }
purrdf-toml = { version = "3.0.1", git = "https://github.com/Blackcat-Informatics/purrdf.git", rev = "6dc51c589bf64008f5b819967a301c30c5bc48ea" }
purrdf-alloc-probe = { version = "3.0.1", git = "https://github.com/Blackcat-Informatics/purrdf.git", rev = "6dc51c589bf64008f5b819967a301c30c5bc48ea" }
purrdf-hash = { version = "3.0.1", git = "https://github.com/Blackcat-Informatics/purrdf.git", rev = "6dc51c589bf64008f5b819967a301c30c5bc48ea" }
purrdf-lex = { version = "3.0.1", git = "https://github.com/Blackcat-Informatics/purrdf.git", rev = "6dc51c589bf64008f5b819967a301c30c5bc48ea" }
purrdf-jsonschema = { version = "3.0.1", git = "https://github.com/Blackcat-Informatics/purrdf.git", rev = "6dc51c589bf64008f5b819967a301c30c5bc48ea" }
purrdf-xsd = { version = "3.0.1", git = "https://github.com/Blackcat-Informatics/purrdf.git", rev = "6dc51c589bf64008f5b819967a301c30c5bc48ea" }
purrdf-rdf = { version = "3.0.1", git = "https://github.com/Blackcat-Informatics/purrdf.git", rev = "6dc51c589bf64008f5b819967a301c30c5bc48ea" }
purrdf-core = { version = "3.0.1", git = "https://github.com/Blackcat-Informatics/purrdf.git", rev = "6dc51c589bf64008f5b819967a301c30c5bc48ea" }
purrdf-iri = { version = "3.0.1", git = "https://github.com/Blackcat-Informatics/purrdf.git", rev = "6dc51c589bf64008f5b819967a301c30c5bc48ea" }
purrdf-deflate = { version = "3.0.1", git = "https://github.com/Blackcat-Informatics/purrdf.git", rev = "6dc51c589bf64008f5b819967a301c30c5bc48ea" }
purrdf-text = { version = "3.0.1", git = "https://github.com/Blackcat-Informatics/purrdf.git", rev = "6dc51c589bf64008f5b819967a301c30c5bc48ea" }
purrdf-testkit = { version = "3.0.1", git = "https://github.com/Blackcat-Informatics/purrdf.git", rev = "6dc51c589bf64008f5b819967a301c30c5bc48ea" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
authors = ["Blackcat Informatics Inc."]
license = "MIT OR Apache-2.0 OR MulanPSL-2.0"
repository = "https://github.com/Blackcat-Informatics/rust-agentic-foundations"

[workspace.lints.rust]
# In a library crate every `pub` item is a dead_code lint root, so `pub`
# silently disables dead-code detection. Declared as workspace lints rather
# than compiler flags, which would also reach path dependencies we do not own;
# workspace lints apply to workspace members only.
unreachable_pub = "deny"
missing_docs = "deny"
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Cargo has no reason key for lint levels, so each exemption carries its reason
# in the comment line directly above it.
# Re-exporting through modules makes names like `foo::FooError` idiomatic.
module_name_repetitions = "allow"
# Marking every pure getter `#[must_use]` adds noise without catching real bugs.
must_use_candidate = "allow"
# Every `#[allow]` in code must say why, so exemptions stay auditable.
allow_attributes_without_reason = "deny"
