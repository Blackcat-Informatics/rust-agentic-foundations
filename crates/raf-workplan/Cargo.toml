[package]
name = "raf-workplan"
description = "Loads capability, change and architecture documents into a typed model and reports findings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
purrdf-lex.workspace = true
purrdf-core.workspace = true
purrdf-rdf.workspace = true
purrdf-hash.workspace = true
purrdf-xsd.workspace = true
purrdf-text.workspace = true
sha2 = "0.11.1"
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
raf-okf = { path = "../raf-okf", version = "0.1.0" }
raf-source = { path = "../raf-source", version = "0.1.0" }
raf-rdf = { path = "../raf-rdf", version = "0.1.0" }

[dev-dependencies]
purrdf-testkit.workspace = true

# The one signal the process runner sends: SIGKILL to the process group it
# started, without a lookup of any program on `PATH`.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["process", "std"] }

# The tests of the process runner make FIFOs for the processes they start
# (`fs`) and block on the end of a process through its pidfd (`event`). The
# production feature set above stays as it is.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["fs", "event", "process", "std"] }

[lints]
workspace = true
