[package]
name = "raf-workplan"
description = "Loads capability, change and architecture documents into a typed model and reports findings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []

[dependencies]
imara-diff.workspace = true
purrdf-lex.workspace = true
purrdf-core.workspace = true
purrdf-rdf.workspace = true
purrdf-hash.workspace = true
purrdf-xsd.workspace = true
purrdf-text.workspace = true
purrdf-markdown.workspace = true
proc-macro2 = { workspace = true, features = ["span-locations"] }
raf-okf.workspace = true
raf-source.workspace = true
raf-rdf.workspace = true

[dev-dependencies]
raf-fixtures.workspace = true
purrdf-testkit.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { workspace = true, features = ["process"] }

[lints]
workspace = true
