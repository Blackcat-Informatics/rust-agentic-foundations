[package]
name = "raf-workplan"
description = "Loads capability, change and architecture documents into a typed model and reports findings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
raf-okf = { path = "../raf-okf", version = "0.1.0" }
raf-source = { path = "../raf-source", version = "0.1.0" }

# The one signal the process runner sends: SIGKILL to the process group it
# started, without a lookup of any program on `PATH`.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["process", "std"] }

[lints]
workspace = true
