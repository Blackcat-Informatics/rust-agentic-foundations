[package]
name = "cargo-workplan"
description = "The cargo workplan subcommand: check, status, the generated documents, the change lifecycle, history, evidence, assessments and coverage of a repository's capability documents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cargo-workplan"
path = "src/main.rs"

[dependencies]
purrdf-lex.workspace = true
purrdf-rdf.workspace = true
raf-source = { path = "../raf-source", version = "0.1.0" }
raf-rdf = { path = "../raf-rdf", version = "0.1.0" }
# Parsing only. The default features add colour output and its terminal
# handling, which the binary does not use.
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
raf-okf = { path = "../raf-okf", version = "0.1.0" }
raf-workplan = { path = "../raf-workplan", version = "0.1.0" }

[dev-dependencies]
purrdf-testkit.workspace = true
purrdf-xsd.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["fs", "event", "process", "std"] }

[lints]
workspace = true
