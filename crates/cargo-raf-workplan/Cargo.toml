[package]
name = "cargo-raf-workplan"
description = "The cargo raf-workplan subcommand: check, status, the generated documents, the change lifecycle, history, evidence, assessments and coverage of a repository's capability documents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []

[[bin]]
name = "cargo-raf-workplan"
path = "src/main.rs"

[dependencies]
purrdf-toml.workspace = true
purrdf-lex.workspace = true
purrdf-rdf.workspace = true
raf-source.workspace = true
raf-rdf.workspace = true
# Parsing only. The default features add colour output and its terminal
# handling, which the binary does not use.
clap.workspace = true
raf-okf.workspace = true
raf-workplan.workspace = true

[dev-dependencies]
raf-fixtures.workspace = true
purrdf-testkit.workspace = true
purrdf-xsd.workspace = true


[lints]
workspace = true
