[package]
name = "cargo-census"
description = "Repository-owned Census checks, ledger migration and exact debt recording."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
raf-census = { path = "../raf-census", version = "0.2.0" }
raf-rdf = { path = "../raf-rdf", version = "0.2.0" }
raf-source = { path = "../raf-source", version = "0.2.0" }

[dev-dependencies]
purrdf-lex.workspace = true
purrdf-testkit.workspace = true
syn = { workspace = true, features = ["full", "parsing"] }


[lints]
workspace = true
