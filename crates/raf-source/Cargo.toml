[package]
name = "raf-source"
description = "Workspace source index: a Tree file seam with disk and memory backends under canonical path containment."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
syn = { version = "3", default-features = false, features = ["full", "parsing", "printing", "visit"] }
quote = { version = "1", default-features = false }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }

# Only the open-flag constants are taken from libc; no foreign function is called.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
