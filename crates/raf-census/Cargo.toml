[package]
name = "raf-census"
description = "The RAF census: normal form 1, BLAKE3 fingerprints, grouping and the RDF 1.2 baseline and index reports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []

[dependencies]
# Shared native BLAKE3 identities; goldens pin the complete portable bytes.
purrdf-hash.workspace = true
# The lexer for function bodies and macro arguments; `span-locations` gives
# string literals their absolute lines.
proc-macro2 = { workspace = true, features = ["span-locations"] }
# The workspace walk: packages, targets, the symbol index and the item bodies.
raf-source = { path = "../raf-source", version = "0.2.0" }
# Shared RDF 1.2 lexical laws; canonical report goldens pin the term spelling.
purrdf-lex.workspace = true
purrdf-jsonschema.workspace = true
purrdf-xsd.workspace = true
raf-rdf = { path = "../raf-rdf", version = "0.2.0" }
# One-way foreign ledger import only; the production policy format is native RDF.
purrdf-toml.workspace = true
# Native projected terms and indexed subject selection for foreign field ownership.
purrdf-core.workspace = true
# Decodes individual string literals; signatures and initialiser ranges come
# from raf-source's budgeted parse rather than a second parse.
syn = { workspace = true, features = ["full", "parsing", "printing", "visit"] }

[dev-dependencies]
raf-fixtures = { path = "../raf-fixtures" }
purrdf-testkit.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true

[lints]
workspace = true
