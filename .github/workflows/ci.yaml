name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-12
        with:
          toolchain: nightly # keep in sync with rust-toolchain.toml
          components: rustfmt
      - name: Format
        run: cargo fmt --all --check
      - name: Format the fuzz harness
        run: cargo fmt --check --manifest-path fuzz/Cargo.toml

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-12
        with:
          toolchain: nightly # keep in sync with rust-toolchain.toml
          components: clippy
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Keep backtrace locations without retaining full type debug data or
    # incremental caches across the many capability-bound Cargo invocations.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-12
        with:
          toolchain: nightly # keep in sync with rust-toolchain.toml
      - name: Install native execution prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap git openssh-client
          bwrap --dev-bind / / --die-with-parent -- /bin/true
      - name: Reject tracked Python files
        run: cargo test --locked --test repo_gates
      - name: Test
        run: cargo test --workspace --locked
      - name: Fetch locked dependencies for every capability binding
        run: cargo fetch --locked
      - name: Install the workspace workplan command
        run: cargo install --path crates/cargo-workplan --debug --locked
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
      - name: Verify every capability binding on Linux
        run: cargo workplan verify

  test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-12
        with:
          toolchain: nightly # keep in sync with rust-toolchain.toml
      - name: Test raf-source in release mode
        run: cargo test -p raf-source --release --locked

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-12
        with:
          toolchain: nightly # keep in sync with rust-toolchain.toml
          components: clippy, rustfmt
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.20.2
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz@0.13.2
      - name: Fuzz harness gates and bounded run
        run: make fuzz FUZZ_DENY=--locked

  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-12
        with:
          toolchain: nightly # keep in sync with rust-toolchain.toml
      - name: Doc (deny warnings)
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -Dwarnings

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-12
        with:
          toolchain: nightly # keep in sync with rust-toolchain.toml
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.20.2
      # The fetching variant: CI may download the advisory database.
      - name: Deny
        run: cargo deny --workspace --locked check

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Outranks rust-toolchain.toml, so this really measures the 1.98.1 floor.
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install MSRV Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-12
        with:
          toolchain: 1.98.1
      - name: Assert the MSRV toolchain is the one in use
        run: |
          rustc --version
          rustc --version | grep -q '^rustc 1\.98\.1 '
      - name: Check workspace on MSRV
        run: cargo check --workspace --all-targets --locked
      - name: Check the fuzz harness on MSRV
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets --locked

  reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.0
          enable-cache: false
      - name: REUSE lint
        run: uvx reuse@6.2.0 lint
