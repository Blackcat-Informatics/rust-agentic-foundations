name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-12
        with:
          toolchain: nightly # keep in sync with rust-toolchain.toml
          components: rustfmt
      - name: Format
        run: cargo fmt --all --check
      - name: Format the fuzz harness
        run: cargo fmt --check --manifest-path fuzz/Cargo.toml

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-12
        with:
          toolchain: nightly # keep in sync with rust-toolchain.toml
          components: clippy
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-12
        with:
          toolchain: nightly # keep in sync with rust-toolchain.toml
      - name: Test
        run: cargo test --workspace --locked
      - name: Install the workspace workplan command
        run: cargo install --path crates/cargo-workplan --debug --locked
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
      - name: Verify every capability binding on Linux
        run: cargo workplan verify

  test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-12
        with:
          toolchain: nightly # keep in sync with rust-toolchain.toml
      - name: Test raf-source in release mode
        run: cargo test -p raf-source --release --locked

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-12
        with:
          toolchain: nightly # keep in sync with rust-toolchain.toml
          components: clippy, rustfmt
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.20.2
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz@0.13.2
      - name: Fuzz harness gates and bounded run
        run: make fuzz FUZZ_DENY=--locked

  cross-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-12
        with:
          toolchain: nightly # keep in sync with rust-toolchain.toml
          targets: x86_64-apple-darwin, x86_64-unknown-freebsd, x86_64-pc-windows-gnu
      - name: Check every raf-source target for the Apple, FreeBSD and Windows targets
        run: make cross-check

  # The containment strategies of the other platforms run only on their own
  # hosts; the Linux jobs run them as test overrides.
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-12
        with:
          toolchain: nightly # keep in sync with rust-toolchain.toml
      - name: Test raf-source on macOS
        run: cargo test -p raf-source --locked
      # The executors of bound tests, doc tests and examples run the real cargo
      # against crates generated into a scratch directory, and their in-process
      # matrix runs through the fake runner; both are part of the claim that they
      # work on every platform. The kill of a bound test or example that never
      # ends is tested on Linux only (`exec::system::tests::cargo`, under a clock
      # the test controls); here the fake runner pins how a kill is judged.
      - name: Test the bound executors against the fake runner on macOS
        run: "cargo test -p raf-workplan --locked --lib bound::"
      # macOS answers EPERM, not ESRCH, to a kill of a group whose members have
      # exited, and only this job can show the runner treats that as done.
      - name: Test the process group kill on macOS
        run: "cargo test -p raf-workplan --locked --lib exec::system::"
      - name: Test the bound executors against the real cargo on macOS
        run: cargo test -p raf-workplan --locked --test bound
      # The binary is run as built, in both shapes of its argument vector, against
      # repositories written to a scratch directory and the real cargo and git.
      - name: Test the cargo-workplan binary on macOS
        run: cargo test -p cargo-workplan --locked
      - name: Install the workspace workplan command
        run: cargo install --path crates/cargo-workplan --debug --locked
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
      - name: Verify every capability binding on macOS
        run: cargo workplan verify

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      # Fixtures and corpus files are compared byte for byte, so the checkout
      # keeps the committed line endings.
      - name: Keep line endings
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-12
        with:
          toolchain: nightly # keep in sync with rust-toolchain.toml
      - name: Test raf-source on Windows
        run: cargo test -p raf-source --locked
      # The executors of bound tests, doc tests and examples run the real cargo
      # against crates generated into a scratch directory, and their in-process
      # matrix runs through the fake runner; both are part of the claim that they
      # work on every platform. The kill of a bound test or example that never
      # ends is tested on Linux only (`exec::system::tests::cargo`, under a clock
      # the test controls); here the fake runner pins how a kill is judged.
      - name: Test the bound executors against the fake runner on Windows
        run: "cargo test -p raf-workplan --locked --lib bound::"
      - name: Test the bound executors against the real cargo on Windows
        run: cargo test -p raf-workplan --locked --test bound
      # The binary is run as built, in both shapes of its argument vector, against
      # repositories written to a scratch directory and the real cargo and git.
      # The tests that use shell stubs are Unix-only and compile to nothing here.
      - name: Test the cargo-workplan binary on Windows
        run: cargo test -p cargo-workplan --locked
      - name: Install the workspace workplan command
        run: cargo install --path crates/cargo-workplan --debug --locked
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
      - name: Verify every capability binding on Windows
        run: cargo workplan verify

  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-12
        with:
          toolchain: nightly # keep in sync with rust-toolchain.toml
      - name: Doc (deny warnings)
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -Dwarnings

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-12
        with:
          toolchain: nightly # keep in sync with rust-toolchain.toml
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.20.2
      # The fetching variant: CI may download the advisory database.
      - name: Deny
        run: cargo deny --workspace --locked check

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Outranks rust-toolchain.toml, so this really measures the 1.98.1 floor.
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install MSRV Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-12
        with:
          toolchain: 1.98.1
      - name: Assert the MSRV toolchain is the one in use
        run: |
          rustc --version
          rustc --version | grep -q '^rustc 1\.98\.1 '
      - name: Check workspace on MSRV
        run: cargo check --workspace --all-targets --locked
      - name: Check the fuzz harness on MSRV
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets --locked

  reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.0
          enable-cache: false
      - name: REUSE lint
        run: uvx reuse@6.2.0 lint
